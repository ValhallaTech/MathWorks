# Netlify Configuration
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Build command - runs the SvelteKit (Vite) production build.
  command = "yarn build"

  # Publish directory - @sveltejs/adapter-netlify writes prerendered static
  # assets here (it reads this value from build.publish; default is "build").
  publish = "build"

  # Base directory for build
  base = "."

  # Pin the toolchain so Netlify matches local/CI builds
  [build.environment]
    NODE_VERSION = "24.15.0"
    YARN_VERSION = "4.15.0"

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache fingerprinted SvelteKit assets aggressively
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No cache for HTML files (always fresh)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
